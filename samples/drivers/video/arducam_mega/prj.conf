# Your base logging and console (unchanged)
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Your video config (unchanged; optimized for ARDUCAM)
CONFIG_VIDEO=y
CONFIG_VIDEO_ARDUCAM_MEGA=y
CONFIG_VIDEO_INIT_PRIORITY=72
CONFIG_VIDEO_BUFFER_POOL_SZ_MAX=2048
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=3

# SPI (unchanged; used by ARDUCAM and nRF7002 shield)
CONFIG_SPI=y

# Wi-Fi and Networking additions (for nRF7002 EK shield + UDP streaming)
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y  # IPv4 for simple UDP
CONFIG_NET_UDP=y   # UDP for low-latency frame sends
CONFIG_NET_SOCKETS=y  # Socket API in Wi-Fi thread
CONFIG_NET_L2_WIFI_MGMT=y  # Wi-Fi link layer
CONFIG_WIFI=y
CONFIG_NRF_WIFI=y  # nRF Wi-Fi driver
CONFIG_NRF700X=y   # nRF7002 chip
CONFIG_NRF700X_RADIO_COEX_1_WIRE=y  # Coex mode for EK shield
CONFIG_NRF700X_UTIL=y  # Init utils
CONFIG_WIFI_MGMT=y  # Management for connect/scan
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y  # Events for connect callback
CONFIG_NET_MGMT_EVENT_INFO=y  # Event details

# Optional: IP config (static for testing; use DHCP if preferred)
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.1.101"  # Board IP
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.1.1"  # Router

# Debug additions (optional; remove for prod to save space)
CONFIG_NET_LOG=y
CONFIG_WIFI_MGMT_LOG_LEVEL_DBG=y  # Wi-Fi debug logs